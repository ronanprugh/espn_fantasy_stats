# Checks every pull request and every push to main: the backend's lint and
# tests, the migrations against Postgres, the backend Docker image, and the
# frontend's lint, type check, tests and production build.
#
# Only the migrations job needs a database (a Postgres service container),
# and none needs ESPN: the backend tests use in-memory SQLite and fakes for
# ESPN, and set their own dummy secrets (tests/conftest.py).

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q

  # The migrations, run for real against Postgres: production is otherwise
  # the first place they execute (the backend tests build tables with
  # SQLite create_all, which never touches Alembic).
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fantasy
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: fantasy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fantasy -d fantasy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fantasy:dev@localhost:5432/fantasy
      # app.config insists on these; nothing here uses them.
      SECRET_KEY: ci
      ENCRYPTION_KEY: Zb0p3QqgWVSYcO2t4Ywq3C2yPF4QO7sGzsG0Wq2T3cE=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Upgrade to head
        run: alembic upgrade head
      - name: Models and migrations agree
        # Fails when a model changed without a migration to match.
        run: alembic check
      - name: Downgrade to base and back
        run: alembic downgrade base && alembic upgrade head

  # The backend image as Render builds it: it must build, start, report
  # healthy and not run as root. Nothing else checks the Dockerfile before
  # a deploy does.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t efs-backend backend
      - name: Start
        # /api/health needs no database, so a placeholder URL will do.
        run: >-
          docker run -d --name efs -p 8080:8080
          -e SECRET_KEY=ci
          -e ENCRYPTION_KEY=Zb0p3QqgWVSYcO2t4Ywq3C2yPF4QO7sGzsG0Wq2T3cE=
          -e DATABASE_URL=postgresql+psycopg://ci:ci@localhost:5432/ci
          efs-backend
      - name: Healthy, answering, and not root
        run: |
          for i in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' efs)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' efs | grep -qx healthy || { docker logs efs; exit 1; }
          curl -fsS localhost:8080/api/health
          test "$(docker exec efs id -u)" != 0

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Type check and build
        run: npm run build
