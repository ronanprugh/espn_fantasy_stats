# Applies the database migrations in backend/alembic/versions to the
# production database (Neon) whenever a change to them lands on main, so
# nobody has to run the SQL by hand.
#
# Setup, once: add a repository secret named DATABASE_URL (Settings ->
# Secrets and variables -> Actions) holding the Neon connection string, in
# the same form as Render's: postgresql+psycopg://user:pass@host/db?sslmode=require
# Neon's direct (non-pooled) host is the better choice for schema changes:
# the one without "-pooler" in its name.
#
# Ordering: Render starts deploying the same push at the same time, and its
# Docker build takes a few minutes, while this job takes well under one, so
# the schema is normally in place before the new code starts. Migrations
# here add tables and columns, which the running (older) code ignores.
#
# Run it by hand from the Actions tab (Run workflow) to apply anything
# pending, e.g. after adding the secret.

name: migrate

on:
  push:
    branches: [main]
    paths:
      - backend/alembic/**
  workflow_dispatch:

# One at a time, and never cancel a run part-way through a migration.
concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Check the database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add a DATABASE_URL repository secret (Settings -> Secrets and variables -> Actions) with the Neon connection string."
            exit 1
          fi

      - name: Install
        run: pip install -r requirements.txt

      - name: Before
        run: alembic current

      - name: Apply pending migrations
        run: alembic upgrade head

      - name: After
        run: alembic current
